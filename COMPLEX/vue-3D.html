// ---------- panel geometry with real holes
const sh=new THREE.Shape();sh.moveTo(-W/2,-H/2);sh.lineTo(W/2,-H/2);sh.lineTo(W/2,H/2);sh.lineTo(-W/2,H/2);sh.lineTo(-W/2,-H/2);
for(const [hx,hy,d,ov] of S.holes){
  const p=new THREE.Path();
  if(ov){const r=ov[1]/2,l=(ov[0]-ov[1])/2;const cx=X(hx),cy=Y(hy);
    p.absarc(cx+l,cy,r,-Math.PI/2,Math.PI/2,false);p.absarc(cx-l,cy,r,Math.PI/2,3*Math.PI/2,false);}
  else p.absarc(X(hx),Y(hy),d/2,0,Math.PI*2,true);
  sh.holes.push(p);
}
const pg=new THREE.ExtrudeGeometry(sh,{depth:PANEL_T,bevelEnabled:false,curveSegments:40});
pg.translate(0,0,-PANEL_T);
const alu=new THREE.MeshStandardMaterial({color:0xbfbfbf,metalness:.85,roughness:.35});
const panel=new THREE.Mesh(pg,[new THREE.MeshStandardMaterial({map:tex,roughness:.55,metalness:.05}),alu]);
panel.castShadow=true;panelG.add(panel);
// ---------- materials
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.1});
const metal=new THREE.MeshStandardMaterial({color:0xd8d8d8,metalness:.9,roughness:.25});
const nickel=new THREE.MeshStandardMaterial({color:0xb8b5ad,metalness:.9,roughness:.3});
const black=M(0x111111), plastic=M(0x1a1a1a);
function box(w,h,d,mat,x,y,z,grp){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;grp.add(m);return m;}
function cyl(r1,r2,h,mat,x,y,z,grp,seg=32){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),mat);m.rotation.x=Math.PI/2;m.position.set(x,y,z);m.castShadow=true;grp.add(m);return m;}
// ---------- PCB
const pcbZ=-PANEL_T-GAP; // pcb front surface
box(W-3,106.5,PCB_T,M(0x13532f),0,Y(11+106.5/2),pcbZ-PCB_T/2,pcbG);
const backZ=pcbZ-PCB_T;
// ---------- parts
for(const it of S.items){
  const x=X(it.x),y=Y(it.y);
  if(it.t==='jack'){
    box(9,10.5,GAP-0.3,plastic,x,y-0.6,pcbZ+(GAP-0.3)/2,pcbG);
    cyl(3,3,GAP+PANEL_T+1.2,nickel,x,y,pcbZ+(GAP+PANEL_T+1.2)/2,pcbG);           // threaded bushing
    const nut=cyl(4,4,1.6,nickel,x,y,0.8,panelG,6);nut.rotation.y=Math.PI/6;      // hex nut on panel
    cyl(1.8,1.8,0.2,black,x,y,1.72,panelG);                                       // hole
  } else if(it.t==='pot'){
    box(9.6,11,6.5,M(0x3a4a6a),x,y+0.5,pcbZ+3.25,pcbG);
    cyl(3.6,3.6,GAP-6.5+PANEL_T,metal,x,y,pcbZ+6.5+(GAP-6.5+PANEL_T)/2,pcbG);
    cyl(3.5,3.5,0.8,metal,x,y,0.4,panelG,6);
    const k=it.s;
    cyl(5.4*k,5.6*k,4.2*k,M(0x0b0b0b),x,y,0.8+2.1*k,panelG,48);
    cyl(4.0*k,4.6*k,4.2*k,M(0x0e0e0e),x,y,0.8+6.3*k,panelG,24);
    cyl(3.4*k,3.4*k,0.6,metal,x,y,0.8+8.4*k+0.3,panelG,48);
    {const a=it.a*Math.PI/180;const ind=box(0.55,2.4*k,0.15,M(0xffffff),x+2.0*k*Math.sin(a),y+2.0*k*Math.cos(a),0.8+8.4*k+0.68,panelG);ind.rotation.z=-a;}
  } else if(it.t==='toggle'){
    if(it.rot%180)box(13,8,GAP-0.4,plastic,x,y,pcbZ+(GAP-0.4)/2,pcbG);else box(8,13,GAP-0.4,plastic,x,y,pcbZ+(GAP-0.4)/2,pcbG);
    cyl(3.1,3.1,GAP+PANEL_T+5,nickel,x,y,pcbZ+(GAP+PANEL_T+5)/2,pcbG);
    const n=cyl(4.2,4.2,1.5,nickel,x,y,0.75,panelG,6);
    const outer=new THREE.Group();outer.position.set(x,y,1.5);const inner=new THREE.Group();inner.rotation.x=Math.PI/2;
    const lv=new THREE.Mesh(new THREE.CylinderGeometry(0.9,1.3,10,20),metal);lv.position.set(0,5,0);lv.castShadow=true;inner.add(lv);
    outer.add(inner);if(it.rot%180)outer.rotation.y=0.38;else outer.rotation.x=-0.38;panelG.add(outer);
  } else if(it.t==='led'){
    cyl(1.5,1.5,GAP+PANEL_T+0.8,M(0x222222),x,y,pcbZ+(GAP+PANEL_T+0.8)/2,pcbG);

  } else if(it.t==='ic'){
    box(it.w,it.h,it.z,M(0x151515),x,y,backZ-it.z/2,pcbG);
    for(let i=0;i<it.pins;i++){const py=y+it.h/2-0.635-i*1.27*(it.pins==7?1:1)-(it.pins==4?0:0);
      box(1.2,0.42,0.25,metal,x-it.w/2-0.5,y+(it.pins-1)*0.635-i*1.27,backZ-0.15,pcbG);
      box(1.2,0.42,0.25,metal,x+it.w/2+0.5,y+(it.pins-1)*0.635-i*1.27,backZ-0.15,pcbG);}
    cyl(0.35,0.35,0.05,M(0x444444),x-it.w/2+0.9,y+it.h/2-0.9,backZ-it.z-0.02,pcbG);
  } else if(it.t==='smd'){
    box(it.w,it.h,it.z,M(it.c),x,y,backZ-it.z/2,pcbG);
    if(it.ends){const hor=(it.rot%180)==0;const e=hor?it.w*0.18:it.h*0.18;
      for(const s of [-1,1]) box(hor?e:it.w+0.02,hor?it.h+0.02:e,it.z+0.02,metal,hor?x+s*(it.w/2-e/2):x,hor?y:y+s*(it.h/2-e/2),backZ-it.z/2,pcbG);}
    if(it.band){const hor=(it.rot%180)==0;box(hor?0.35:it.w+0.02,hor?it.h+0.02:0.35,it.z+0.02,M(0xcccccc),hor?x-it.w*0.3:x,hor?y:y+it.h*0.3,backZ-it.z/2,pcbG);}
  } else if(it.t==='header'){
    box(it.w-0.6,it.h-0.6,9,M(0x161616),x,y,backZ-4.5,pcbG);
    box(it.w-2.2,it.h-2.2,0.2,M(0x050505),x,y,backZ-9.05,pcbG);
    // ribbon cable stub
    const rb=box(it.w-3,1.2,30,M(0x9a9aa2),x,y,backZ-9-15,pcbG);rb.material.color.set(0xa7a7ad);
    box(0.6,1.25,30,M(0xb02020),x-(it.w-3)/2+0.3,y,backZ-9-15,pcbG);
  } else if(it.t==='trim'){
    box(6.8,6.8,5,M(0x2b5fb8),x,y,backZ-2.5,pcbG);
    cyl(1.3,1.3,0.4,M(0xeeeeee),x,y,backZ-5.2,pcbG);
  }
}
// ---------- views
const views={front:[0,0,1],three:[0.55,0.3,0.78],side:[1,0.03,-0.06],back:[-0.35,0.12,-0.93]};
function fitDist(){const vf=cam.fov*Math.PI/180;const hf=2*Math.atan(Math.tan(vf/2)*cam.aspect);return Math.max(75/Math.tan(vf/2),(S.W/2+11)/Math.tan(hf/2))*1.08;}
function setView(v){const p=views[v];const n=Math.hypot(p[0],p[1],p[2]),d=fitDist();cam.position.set(p[0]/n*d,p[1]/n*d,p[2]/n*d-8);ctl.target.set(0,0,-8);ctl.update();
  document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.getElementById('ex').oninput=e=>{panelG.position.z=+e.target.value*1.2;};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?45:32;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();setView('three');
(function loop(){ctl.update();renderer.render(scene,cam);requestAnimationFrame(loop);})();
